<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - BelanjaHub</title>
  <!-- FIXED PATH: use ../css/login.css -->
  <link rel="stylesheet" href="../css/login.css" />
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1><i class="fas fa-shopping-bag"></i> BelanjaHub</h1>
          <p>Login to start shopping</p>
        </div>
        
        <form id="loginForm" class="auth-form">
          <h2>Login to Your Account</h2>
          
          <div class="input-group">
            <label for="email">
              <i class="fas fa-envelope"></i> Email
            </label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="example@email.com" 
              required 
            />
            <span class="error-message" id="emailError"></span>
          </div>
          
          <div class="input-group">
            <label for="password">
              <i class="fas fa-lock"></i> Password
            </label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Minimum 6 characters" 
              required 
              minlength="6" 
            />
            <span class="error-message" id="passwordError"></span>
          </div>
          
          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-password">Forgot password?</a>
          </div>
          
          <div class="form-actions">
            <button type="submit" class="btn primary" id="loginBtn">
              <span id="btnText">Login</span>
              <div id="btnLoader" class="btn-loader"></div>
            </button>
            <a href="../index.html" class="btn ghost">
              <i class="fas fa-arrow-left"></i> Back to Home
            </a>
          </div>
          
          <div class="auth-divider">
            <span>or</span>
          </div>
          
          <p class="auth-toggle">
            Don't have an account? 
            <a href="signup.html" class="toggle-link">Sign up here</a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <!-- Pop-up for successful login -->
  <div class="popup-overlay" id="successPopup">
    <div class="popup">
      <div class="popup-icon">
        <i class="fas fa-check-circle"></i>
      </div>
      <h3>Login Successful!</h3>
      <p id="welcomeMessage">Welcome back!</p>
      <button class="popup-btn primary" id="goToHome">
        <i class="fas fa-home"></i> Go to Home
      </button>
    </div>
  </div>

  <script>
    // Get form and pop-up elements
    const loginForm = document.getElementById('loginForm');
    const successPopup = document.getElementById('successPopup');
    const goToHomeBtn = document.getElementById('goToHome');
    const loginBtn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const btnLoader = document.getElementById('btnLoader');
    
    // Input and error message elements
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const welcomeMessage = document.getElementById('welcomeMessage');
    
    // Email validation function
    function isValidEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }
    
    // Function to show error
    function showError(inputElement, errorElement, message) {
      inputElement.classList.add('input-error');
      errorElement.textContent = message;
      errorElement.style.display = 'block';
    }
    
    // Function to hide error
    function hideError(inputElement, errorElement) {
      inputElement.classList.remove('input-error');
      errorElement.style.display = 'none';
    }
    
    // Function to show loading state
    function showLoading() {
      btnText.style.opacity = '0.5';
      btnLoader.style.display = 'block';
      loginBtn.disabled = true;
    }
    
    // Function to hide loading state
    function hideLoading() {
      btnText.style.opacity = '1';
      btnLoader.style.display = 'none';
      loginBtn.disabled = false;
    }
    
    // Real-time validation
    emailInput.addEventListener('blur', function() {
      const email = emailInput.value.trim();
      if (!email) {
        showError(emailInput, emailError, 'Email is required');
      } else if (!isValidEmail(email)) {
        showError(emailInput, emailError, 'Invalid email format');
      } else {
        hideError(emailInput, emailError);
      }
    });
    
    emailInput.addEventListener('input', function() {
      hideError(emailInput, emailError);
    });
    
    passwordInput.addEventListener('blur', function() {
      const password = passwordInput.value;
      if (!password) {
        showError(passwordInput, passwordError, 'Password is required');
      } else if (password.length < 6) {
        showError(passwordInput, passwordError, 'Password must be at least 6 characters');
      } else {
        hideError(passwordInput, passwordError);
      }
    });
    
    passwordInput.addEventListener('input', function() {
      hideError(passwordInput, passwordError);
    });
    
    // Event listener for form submission
    loginForm.addEventListener('submit', async function(event) {
      event.preventDefault(); // Prevent default form submit
      
      let isValid = true;
      
      // Validate email
      const email = emailInput.value.trim();
      if (!email) {
        showError(emailInput, emailError, 'Email is required');
        isValid = false;
      } else if (!isValidEmail(email)) {
        showError(emailInput, emailError, 'Invalid email format');
        isValid = false;
      }
      
      // Validate password
      const password = passwordInput.value;
      if (!password) {
        showError(passwordInput, passwordError, 'Password is required');
        isValid = false;
      } else if (password.length < 6) {
        showError(passwordInput, passwordError, 'Password must be at least 6 characters');
        isValid = false;
      }
      
      // If all valid, process login
      if (isValid) {
        showLoading();
        
        // Simulate delay for login process
        await new Promise(resolve => setTimeout(resolve, 1500));
        
        // Check if user exists in localStorage
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        const user = users.find(u => u.email === email && u.password === password);
        
        if (user) {
          // Save login status in localStorage
          localStorage.setItem('isLoggedIn', 'true');
          localStorage.setItem('userEmail', email);
          localStorage.setItem('userName', user.name || email.split('@')[0]);
          
          // If "Remember me" checkbox is checked
          const rememberMe = document.getElementById('rememberMe').checked;
          if (rememberMe) {
            localStorage.setItem('rememberMe', 'true');
            localStorage.setItem('savedEmail', email);
          } else {
            localStorage.removeItem('rememberMe');
            localStorage.removeItem('savedEmail');
          }
          
          // Update welcome message
          welcomeMessage.textContent = `Welcome back, ${user.name || email.split('@')[0]}!`;
          
          // Show success pop-up
          successPopup.style.display = 'flex';
        } else {
          hideLoading();
          alert('Invalid email or password!\n\nIf you don\'t have an account, please sign up first.');
        }
      }
    });
    
    // Event listener for "Go to Home" button
    goToHomeBtn.addEventListener('click', function() {
      window.location.href = '../index.html';
    });
    
    // Optional: Close pop-up by clicking outside
    successPopup.addEventListener('click', function(event) {
      if (event.target === successPopup) {
        window.location.href = '../index.html';
      }
    });
    
    // Optional: Add enter key to submit form
    loginForm.addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        loginForm.dispatchEvent(new Event('submit'));
      }
    });
    
    // Forgot password functionality
    document.querySelector('.forgot-password')?.addEventListener('click', function(e) {
      e.preventDefault();
      const email = prompt('Enter your email to reset password:');
      if (email && isValidEmail(email)) {
        alert(`Password reset link has been sent to ${email}\n\n(Note: This is just a simulation)`);
      } else if (email) {
        alert('Invalid email!');
      }
    });
    
    // Check if there is saved email for "Remember me"
    document.addEventListener('DOMContentLoaded', function() {
      const rememberMe = localStorage.getItem('rememberMe') === 'true';
      const savedEmail = localStorage.getItem('savedEmail');
      
      if (rememberMe && savedEmail) {
        emailInput.value = savedEmail;
        document.getElementById('rememberMe').checked = true;
      }
      
      // Auto-focus to email input
      emailInput.focus();
    });
  </script>
</body>
</html>
