<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - BelanjaHub</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1><i class="fas fa-shopping-bag"></i> BelanjaHub</h1>
                    <p>Create a new account to start shopping</p>
                </div>
                
                <form id="signupForm" class="auth-form">
                    <h2>Create New Account</h2>
                    
                    <div class="input-group">
                        <label for="name">
                            <i class="fas fa-user"></i> Full Name</label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            placeholder="Enter your full name" 
                            required/>
                        <span class="error-message" id="nameError"></span>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i> Email
                        </label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="example@email.com" 
                            required 
                        />
                        <span class="error-message" id="emailError"></span>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Minimum 6 characters" 
                            required 
                            minlength="6"
                        />
                        <span class="error-message" id="passwordError"></span>
                    </div>
                    
                    <div class="input-group">
                        <label for="confirmPassword">
                            <i class="fas fa-lock"></i> Confirm Password
                        </label>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            placeholder="Retype your password" 
                            required 
                            minlength="6"
                        />
                        <span class="error-message" id="confirmPasswordError"></span>
                    </div>
                    
                    <div class="form-options">
                        <label class="terms">
                            <input type="checkbox" id="agreeTerms" required>
                            <span>I agree to the <a href="#" class="terms-link">Terms & Conditions</a></span>
                        </label>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn primary" id="signupBtn">
                            <span id="btnText">Sign Up Now</span>
                            <div id="btnLoader" class="btn-loader"></div>
                        </button>
                        <a href="../index.html" class="btn ghost">
                            <i class="fas fa-arrow-left"></i> Back to Home
                        </a>
                    </div>
                    
                    <div class="auth-divider">
                        <span>or</span>
                    </div>
                    
                    <p class="auth-toggle">
                        Already have an account? 
                        <a href="login.html" class="toggle-link">Login here</a>
                    </p>
                </form>
            </div>
        </div>
    </main>

    <!-- Pop-up for successful registration -->
    <div class="popup-overlay" id="successPopup">
        <div class="popup">
            <div class="popup-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h3>Registration Successful!</h3>
            <p id="welcomeMessage">Your account has been successfully created.</p>
            <button class="popup-btn primary" id="goToLogin">
                <i class="fas fa-sign-in-alt"></i> Login Now
            </button>
        </div>
    </div>

    <script>
        // Get form and pop-up elements
        const signupForm = document.getElementById('signupForm');
        const successPopup = document.getElementById('successPopup');
        const goToLoginBtn = document.getElementById('goToLogin');
        const signupBtn = document.getElementById('signupBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const welcomeMessage = document.getElementById('welcomeMessage');
        
        // Input elements
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        
        // Error elements
        const nameError = document.getElementById('nameError');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const confirmPasswordError = document.getElementById('confirmPasswordError');
        
        // Email validation function
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        // Function to show error
        function showError(inputElement, errorElement, message) {
            inputElement.classList.add('input-error');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }
        
        // Function to hide error
        function hideError(inputElement, errorElement) {
            inputElement.classList.remove('input-error');
            errorElement.style.display = 'none';
        }
        
        // Function to show loading
        function showLoading() {
            btnText.style.opacity = '0.5';
            btnLoader.style.display = 'block';
            signupBtn.disabled = true;
        }
        
        // Function to hide loading
        function hideLoading() {
            btnText.style.opacity = '1';
            btnLoader.style.display = 'none';
            signupBtn.disabled = false;
        }
        
        // Real-time validation
        nameInput.addEventListener('blur', function() {
            const name = nameInput.value.trim();
            if (!name) {
                showError(nameInput, nameError, 'Name is required');
            } else if (name.length < 3) {
                showError(nameInput, nameError, 'Name must be at least 3 characters');
            } else {
                hideError(nameInput, nameError);
            }
        });
        
        emailInput.addEventListener('blur', function() {
            const email = emailInput.value.trim();
            if (!email) {
                showError(emailInput, emailError, 'Email is required');
            } else if (!isValidEmail(email)) {
                showError(emailInput, emailError, 'Invalid email format');
            } else {
                // Check if email already exists
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const emailExists = users.some(user => user.email === email);
                if (emailExists) {
                    showError(emailInput, emailError, 'Email already registered');
                } else {
                    hideError(emailInput, emailError);
                }
            }
        });
        
        passwordInput.addEventListener('blur', function() {
            const password = passwordInput.value;
            if (!password) {
                showError(passwordInput, passwordError, 'Password is required');
            } else if (password.length < 6) {
                showError(passwordInput, passwordError, 'Password must be at least 6 characters');
            } else {
                hideError(passwordInput, passwordError);
            }
        });
        
        confirmPasswordInput.addEventListener('blur', function() {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            if (!confirmPassword) {
                showError(confirmPasswordInput, confirmPasswordError, 'Please confirm your password');
            } else if (password !== confirmPassword) {
                showError(confirmPasswordInput, confirmPasswordError, 'Passwords do not match');
            } else {
                hideError(confirmPasswordInput, confirmPasswordError);
            }
        });
        
        // Event listener for form submission
        signupForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            let isValid = true;
            
            // Validate name
            const name = nameInput.value.trim();
            if (!name) {
                showError(nameInput, nameError, 'Name is required');
                isValid = false;
            } else if (name.length < 3) {
                showError(nameInput, nameError, 'Name must be at least 3 characters');
                isValid = false;
            }
            
            // Validate email
            const email = emailInput.value.trim();
            if (!email) {
                showError(emailInput, emailError, 'Email is required');
                isValid = false;
            } else if (!isValidEmail(email)) {
                showError(emailInput, emailError, 'Invalid email format');
                isValid = false;
            } else {
                // Check unique email
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const emailExists = users.some(user => user.email === email);
                if (emailExists) {
                    showError(emailInput, emailError, 'Email already registered');
                    isValid = false;
                }
            }
            
            // Validate password
            const password = passwordInput.value;
            if (!password) {
                showError(passwordInput, passwordError, 'Password is required');
                isValid = false;
            } else if (password.length < 6) {
                showError(passwordInput, passwordError, 'Password must be at least 6 characters');
                isValid = false;
            }
            
            // Validate confirm password
            const confirmPassword = confirmPasswordInput.value;
            if (!confirmPassword) {
                showError(confirmPasswordInput, confirmPasswordError, 'Please confirm your password');
                isValid = false;
            } else if (password !== confirmPassword) {
                showError(confirmPasswordInput, confirmPasswordError, 'Passwords do not match');
                isValid = false;
            }
            
            // Validate terms
            const agreeTerms = document.getElementById('agreeTerms').checked;
            if (!agreeTerms) {
                alert('You must agree to the Terms & Conditions');
                isValid = false;
            }
            
            if (isValid) {
                showLoading();
                
                // Simulate delay
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // Save user to localStorage
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const newUser = {
                    id: Date.now(),
                    name: name,
                    email: email,
                    password: password,
                    createdAt: new Date().toISOString()
                };
                
                users.push(newUser);
                localStorage.setItem('users', JSON.stringify(users));
                
                // Auto login after registration
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userName', name);
                
                // Update welcome message
                welcomeMessage.textContent = `Welcome, ${name}!`;
                
                // Show success pop-up
                successPopup.style.display = 'flex';
                
                hideLoading();
            }
        });
        
        // Event listener for "Login Now" button
        goToLoginBtn.addEventListener('click', function() {
            window.location.href = '../index.html';
        });
        
        // Terms link
        document.querySelector('.terms-link')?.addEventListener('click', function(e) {
            e.preventDefault();
            alert('Terms & Conditions:\n\n1. You are responsible for account security\n2. Personal data will be protected\n3. Fraud is not allowed\n\n(Note: This is just an example)');
        });
        
        // Auto-focus to name input
        nameInput.focus();
    </script>
</body>
</html>
