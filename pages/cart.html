    <!-- Additional script for handling redirect -->
    <script>
        // Function to handle all home redirects
        function setupHomeRedirects() {
            // Capture all links that go to home
            const homeLinks = document.querySelectorAll('a[href*="../index.html"]');
            
            homeLinks.forEach(link => {
                // If link uses href="#", replace with redirect function
                if (link.getAttribute('href') === '#') {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        redirectToHome();
                    });
                }
            });
            
            // Add event listener for special buttons
            document.querySelectorAll('.back-btn, .continue-shopping').forEach(btn => {
                if (btn.tagName === 'BUTTON') {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        redirectToHome();
                    });
                }
            });
        }
        
        // Safe redirect function
        function redirectToHome() {
            console.log('Redirecting to home from cart page...');
            
            // Check if on localhost or server
            const currentUrl = window.location.href;
            const isLocalhost = currentUrl.includes('localhost') || currentUrl.includes('127.0.0.1');
            
            if (isLocalhost) {
                // For localhost
                const baseUrl = window.location.origin;
                const isInPagesFolder = currentUrl.includes('/pages/');
                
                if (isInPagesFolder) {
                    // If in pages/ folder, use ../index.html
                    window.location.href = '../index.html';
                } else {
                    // If not, use absolute path
                    window.location.href = baseUrl + '../index.html';
                }
            } else {
                // For production
                window.location.href = '../index.html';
            }
        }
        
        // Run when page is ready
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Cart page loaded successfully');
            console.log('Current URL:', window.location.href);
            
            // Setup redirects
            setupHomeRedirects();
            
            // Add fallback for buttons
            const demoAddBtn = document.getElementById('demo-add-items');
            if (demoAddBtn) {
                demoAddBtn.addEventListener('click', function() {
                    // If demo button fails, give feedback
                    setTimeout(() => {
                        if (document.querySelector('.empty-cart')) {
                            alert('Demo feature requires correct cart.js file.\nMake sure cart.js exists in js/ folder.');
                        }
                    }, 1000);
                });
            }
        });
        
        // Catch errors if any
        window.addEventListener('error', function(e) {
            console.error('Error occurred:', e.message);
            console.error('Error at:', e.filename, 'line:', e.lineno);
        });
    </script>
